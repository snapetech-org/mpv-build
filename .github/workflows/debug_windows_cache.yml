# ng-runner-policy: private-jit-only-v1
# Manual debugging for the windows build-state cache.
#
# winbuild runs its ExternalProject steps with LOG 1, so a failing step's
# real error lands in <pkg>-prefix/src/<pkg>-stamp/<pkg>-<step>-*.log inside
# the per-arch tree -- which the build job saves to the cache even on
# failure. This workflow restores the newest cache entry for an arch and
# prints the logs matching a pattern, so a CI-only failure can be read
# without burning a build cycle.
name: Debug windows cache

run-name: >-
  ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Explicit CI action
        required: true
        type: choice
        options: [ci]
      runner_pool_tag:
        description: Explicit private runner pool
        required: true
        type: choice
        options: [private]
      arch:
        description: target arch
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      pattern:
        description: find -path pattern for logs under build/windows
        default: "*libvpl*"

permissions:
  contents: read

jobs:
  dump:
    name: Dump ${{ inputs.arch }} logs (${{ inputs.pattern }})
    # The host the cached windows tree was built on (publish.yml build-windows).
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-dump"]}}', github.run_id)) }}
    steps:
      - name: Restore newest build state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows/${{ inputs.arch }}
            build/windows/src
            build/windows/rustup
          key: windows-ep2-${{ inputs.arch }}-never-matches-exactly
          restore-keys: |
            windows-ep2-${{ inputs.arch }}-

      - name: Dump matching logs
        run: |
          find build/windows -path "*${{ inputs.pattern }}*" -name '*.log' | while read -r f; do
            echo "===== $f ====="
            tail -120 "$f"
            echo
          done
          echo "===== matching non-log files ====="
          find build/windows -path "*${{ inputs.pattern }}*" ! -name '*.log' -maxdepth 6 | head -40
