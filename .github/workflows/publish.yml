# ng-runner-policy: public-hosted-v1
name: Publish binaries

run-name: >-
  ${{ github.event_name == 'schedule' && 'action:keep-windows-cache:pool:public' || format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

# Publish binaries after a trusted-main build dispatch. Every compatible
# build, test, scan, package and publish job uses public GitHub-hosted runners.
# `private` remains a hosted-only alias for old callers.
#
# Binaries are sharded per platform group. Each group builds independently,
# uploads to its own `binaries-<group>` rolling prerelease and contributes only
# its own `platforms.<group>` section of artifacts.json; one final job splices
# the sections together and commits the manifest. The plan job's group list
# comes from `scripts/keys.py groups` (which discovers platforms/*/group.json),
# and the recording step is one matrix job shared by every group.json group --
# only apple, whose build is defined in the Swift driver, has a job of its own.
# Those two are not derived from the group list: the matrix row names the group
# and the uploaded-artifact prefix its build job uploads, and the build job
# itself is per platform, so a new group is a group.json, its build job, and a
# row in the record matrix below. The Android build lives in android.yml,
# called from the trusted publish and manual CI workflows.
#
# Only main publishes. Runner-group workflow restrictions admit this workflow
# only from its reviewed main ref. The scheduled keepalive below restores only
# Windows build caches and never runs build or publication jobs.
on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:
    inputs:
      action_tag:
        description: Explicit CI action
        required: true
        type: choice
        options: [build, keep-windows-cache]
      runner_pool_tag:
        description: Public GitHub-hosted runners for all build and release jobs
        required: true
        type: choice
        options: [public, private]
        default: public

# Two runs must never interleave asset uploads or commits to main, and a
# cancelled run could leave the manifest committed without its assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-cache-maintenance' || '' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Patch regression tests
    permissions:
      contents: read
    # The harnesses need only bash, python3 and cc (plus libass's host
    # dependencies for one of them, and Xcode for the apple merge test), but
    # not a Linux cc:
    # test_avf_timebase_servo.c uses M_PI under -std=c11, which glibc hides in
    # strict ISO mode (gcc 13: "'M_PI' undeclared"), while Apple libc
    # exposes it. Keep them on the compiler they are written for.
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        true
      )
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Keep small Python and Rust caches on local APFS for reliable metadata access.
      PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/python@3.12/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for formula in cmake autoconf automake libtool pkgconf freetype fribidi harfbuzz libunibreak python@3.12; do
            brew list --versions "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if (( ${#missing[@]} )); then HOMEBREW_NO_AUTO_UPDATE=1 brew install "${missing[@]}"; fi

      - name: Compile native Apple build driver
        run: swift build --package-path Sources/BuildScripts --scratch-path "$RUNNER_TEMP/native-build-driver-check"

      - name: Verify Apple SDK and native regression toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in cmake autoconf automake glibtool pkg-config clang clang++ xcodebuild xcrun; do
            command -v "$tool" >/dev/null || { echo "missing native regression tool: $tool" >&2; exit 1; }
          done
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          pkg-config --exists freetype2 fribidi harfbuzz libunibreak
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path >/dev/null

      - name: Test AO PCM lookahead
        run: ./scripts/test_ao_pcm_lookahead.sh

      - name: Test AO compressed-audio option
        run: ./scripts/test_ao_compressed_audio_option.sh

      - name: Test AO probe refusal
        run: ./scripts/test_ao_probe_refusal.sh

      - name: Test spatial audio output
        run: bash ./scripts/test_ao_spatial.sh

      - name: Test spatial audio bridge
        run: bash ./scripts/test_spatial_feed.sh

      - name: Test build process output capture
        run: bash ./scripts/test_build_process.sh

      - name: Test AVFoundation timebase servo
        run: ./scripts/test_avf_timebase_servo.sh

      - name: Test AVFoundation shader target geometry
        run: bash scripts/test_avf_shader_target.sh

      - name: Test AVFoundation host presentation clock
        run: bash ./scripts/test_avf_host_present.sh

      - name: Test AVFoundation PiP frame-space OSD
        run: ./scripts/test_avf_pip_frame_space_osd.sh

      - name: Test AVFoundation OSD layer geometry under host zoom
        run: ./scripts/test_avf_osd_layer_geometry.sh

      - name: Test AVFoundation subtitle wait policy
        run: ./scripts/test_avf_osd_ahead.sh

      - name: Test AVFoundation Dolby Vision profile 5 RPU selection
        run: ./scripts/test_avf_dovi_profile5_rpu.sh

      - name: Test AVFoundation host-mode clock rules
        run: ./scripts/test_avf_host_present.sh

      - name: Test MediaCodec timing cadence
        run: bash ./scripts/test_mediacodec_timing.sh

      - name: Test MediaCodec vsync sampler under Android 11 mode switches
        run: bash ./scripts/test_mediacodec_vsync.sh

      - name: Test MediaCodec subtitle geometry
        run: bash ./scripts/test_mediacodec_geometry.sh

      - name: Test MediaCodec OSD scheduler
        run: bash ./scripts/test_mediacodec_osd.sh

      - name: Test MediaCodec OSD surface retirement
        run: bash ./scripts/test_mediacodec_rebind.sh

      - name: Test MediaCodec OSD-plane letterbox fill
        run: bash ./scripts/test_mediacodec_letterbox.sh

      - name: Test the decoder busy policies
        run: bash ./scripts/test_lavc_busy_policy.sh

      - name: Test MediaCodec Dolby Vision packet filter
        run: bash ./scripts/test_mediacodec_dv_filter.sh

      - name: Test MediaCodec input sizing and submission
        run: bash ./scripts/test_mediacodec_input.sh

      - name: Test MediaCodec end of stream after a flush
        run: bash ./scripts/test_mediacodec_eos.sh

      - name: Test MediaCodec flush before the first input
        run: bash ./scripts/test_mediacodec_flush.sh

      - name: Test MediaCodec errors across a flush
        run: bash ./scripts/test_mediacodec_error.sh

      - name: Test a paused MediaCodec decoder with the output buffers held
        run: bash ./scripts/test_mediacodec_paused.sh

      - name: Test MediaCodec output crop transitions
        run: bash ./scripts/test_mediacodec_crop.sh

      - name: Test MediaCodec rendered-frame feedback ring
        run: bash ./scripts/test_mediacodec_rendered.sh

      - name: Test the MediaCodec media3_rate switch
        run: bash ./scripts/test_mediacodec_rate.sh

      - name: Test MediaCodec pre-decode frame shedding
        run: bash ./scripts/test_mediacodec_shed.sh

      - name: Test MediaCodec presentation order for decode-order timestamps
        run: bash ./scripts/test_mediacodec_reorder.sh

      - name: Test the core's frame queue for a self-timed VO
        run: bash ./scripts/test_player_queue_frames.sh

      - name: Test the audio output reload with a frame held for the old AO
        run: bash ./scripts/test_audio_reload_held_frame.sh

      - name: Test the video chain releasing the frame that holds its decoder
        run: bash ./scripts/test_player_release_held_frame.sh

      - name: Test the packets a refresh seek reads back
        run: bash ./scripts/test_demux_refresh.sh

      - name: Test FFmpeg log lines reaching the instance that logged them
        run: bash ./scripts/test_av_log_routing.sh

      - name: Test the codec profile the demuxers publish at load
        run: bash ./scripts/test_demux_codec_profile.sh

      - name: Test PGS palette cache across an epoch
        run: bash ./scripts/test_pgs_palette.sh

      - name: Test TCP hostname lookup by address family
        run: bash ./scripts/test_tcp_family_lookup.sh

      # The mpv-android AAR's JNI glue (platforms/android/lib/src/main/cpp)
      # against fakes, compiled with the patched mpv and FFmpeg headers.
      - name: Test the android JNI glue
        run: bash ./scripts/test_android_glue.sh

      - name: Test Android AudioTrack deadline timing
        run: bash ./scripts/test_audiotrack_timing.sh

      # The one harness that builds a dependency: the libass series' layout
      # cache is only observable through ass_render_frame itself.
      - name: Test libass series harnesses
        run: bash ./scripts/test_libass_series.sh

      - name: Test patch framework
        run: ./scripts/test_patches.sh

      - name: Test Linux ARM64 container runtime bootstrap
        run: |
          python3 scripts/test_linux_arm64_runtime_workflow.py
          python3 scripts/test_music_dsp_filters.py

      - name: Test platform toolchain contracts
        run: |
          python3 scripts/test_ci_toolchain_workflows.py
          python3 scripts/test_check_plezy_audio_tap_export.py
          python3 scripts/test_windows_cache_workspace.py
          python3 scripts/test_prepare_android_java.py
          python3 scripts/test_prepare_android_qairt.py
          python3 scripts/test_inspect_pcm_package.py
          python3 scripts/test_codec_inventory.py
          python3 scripts/test_lcevc_sdk.py
          bash scripts/test_lcevc_probe.sh
          python3 scripts/test_dependency_retry.py
          python3 scripts/test_release_repository.py

      - name: Test shared extractor
        run: ./scripts/test_extract.sh

      - name: Test content keys
        run: ./scripts/test_keys.sh

      - name: Test Android Git source fallback
        run: bash platforms/android/test_download_git.sh

      - name: Test debug symbols
        run: bash ./scripts/test_symbols.sh

      - name: Test apple XCFramework merge reproducibility
        run: ./scripts/test_apple_merge.sh

  # Compile independently of macOS test capacity; publication below still
  # requires the complete regression suite to pass.
  plan:
    name: Plan
    permissions:
      contents: read
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        true
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      # The stale libraries of the apple group, comma-separated: the `libs=`
      # argument the apple build legs need.
      stale_apple: ${{ steps.stale.outputs.stale_apple }}
      # The stale artifacts of the android group with both delimiters
      # (`,libmpv-android,mpv-android,`): the tarball legs run only for the
      # first; the AAR is stale whenever the group is, since its key covers
      # the tarballs' key.
      stale_android: ${{ steps.stale.outputs.stale_android }}
      # The stale groups with both delimiters (`,apple,android,`), so a gate is
      # an exact `contains(..., ',<group>,')` test rather than a substring
      # guess. Empty when every group is already published, which is what skips
      # the build, publish and manifest jobs.
      stale_groups: ${{ steps.stale.outputs.stale_groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Provision and verify artifact tools
        shell: bash
        run: bash scripts/prepare_linux_artifacts.sh --public

      - name: Validate patch series
        run: python3 scripts/patches.py check

      - name: Compute stale libraries per group
        id: stale
        # shell: bash adds pipefail, which the default `bash -e` lacks, so a
        # crash in keys.py is not swallowed by the pipe into paste.
        shell: bash
        run: |
          # The group list and the per-group platform variants are discovered,
          # not restated here: keys.py reads them out of platforms/*/group.json.
          groups="$(python3 scripts/keys.py groups)"
          echo "groups=${groups}" >> "$GITHUB_STEP_SUMMARY"

          stale_groups=""
          for group in ${groups}; do
            stale="$(python3 scripts/keys.py stale --platform-group "${group}" | paste -sd, -)"
            if [ -n "${stale}" ]; then
              stale_groups="${stale_groups},${group}"
              echo "${group}: rebuilding ${stale}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${group}: binaries already published for this tree" >> "$GITHUB_STEP_SUMMARY"
              # Nothing to build means the committed manifest must already
              # describe this tree exactly, otherwise the commit is not
              # pinnable and no later job would notice.
              python3 scripts/keys.py verify --platform-group "${group}"
            fi
            if [ "${group}" = "apple" ]; then
              echo "stale_apple=${stale}" >> "$GITHUB_OUTPUT"
            fi
            if [ "${group}" = "android" ]; then
              echo "stale_android=,${stale}," >> "$GITHUB_OUTPUT"
            fi
          done
          # Both delimiters, so `contains(..., ',<group>,')` is an exact test:
          # a bare trailing group (`...,apple`) would otherwise not match.
          # Empty when nothing is stale, which is what skips the later jobs.
          if [ -n "${stale_groups}" ]; then
            echo "stale_groups=${stale_groups}," >> "$GITHUB_OUTPUT"
          else
            echo "stale_groups=" >> "$GITHUB_OUTPUT"
          fi

  build-apple:
    name: Build apple ${{ matrix.name }}
    needs: plan
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        contains(needs.plan.outputs.stale_groups, ',apple,')
      )
    permissions:
      contents: read
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      # Keep small Python and Rust caches on local APFS for reliable metadata access.
      PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/python@3.12/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      RUSTUP_AUTO_INSTALL: '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: macos
            platforms: macos
            platform_type: macos
          - name: maccatalyst
            platforms: maccatalyst
            platform_type: maccatalyst
          - name: iphoneos
            platforms: ios-device
            platform_type: ios
          - name: iphonesimulator
            platforms: ios-simulator
            platform_type: isimulator
          - name: tvos
            platforms: tvos-device
            platform_type: tvos
          - name: tvsimulator
            platforms: tvos-simulator
            platform_type: tvsimulator
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Apple build tools on the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake libtool ninja cmake pkgconf wget nasm sdl2 glslang
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --skip-link python@3.12

      - name: Verify Apple toolchain and install pinned Meson
        shell: bash
        run: |
          set -euo pipefail
          for tool in autoconf automake glibtool ninja cmake pkg-config wget nasm sdl2-config glslang python3 xcodebuild xcrun; do
            command -v "$tool" >/dev/null || { echo "missing Apple toolchain command: $tool" >&2; exit 1; }
          done
          glslang_version="$(sed -n 's/^glslang=//p' toolchain/apple.txt)"
          test -n "$glslang_version"
          glslang --version | grep -F "Glslang Version:" | grep -F ":${glslang_version}"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          for sdk in macosx iphoneos iphonesimulator appletvos appletvsimulator; do
            sdk_path="$(xcrun --sdk "$sdk" --show-sdk-path)"
            test -d "$sdk_path" || { echo "missing Xcode SDK: $sdk" >&2; exit 1; }
          done
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          meson_bin="$RUNNER_TEMP/meson-venv/bin"
          "$meson_bin/python" -m pip install --disable-pip-version-check meson==1.4.2
          echo "$meson_bin" >> "$GITHUB_PATH"
          export PATH="$meson_bin:$PATH"
          meson --version

      # Only the stale libraries are compiled; the rest are restored from their
      # published per-platform zips. No version= argument: the URLs the build
      # script would spell from it are replaced by the manifest's
      # content-addressed ones in the publish job.
      - name: Bootstrap pinned rustup and install pinned Rust toolchain
        run: |
          bash scripts/install_pinned_rustup_macos.sh
          rust_version="$(sed -n 's/^rust=//p' toolchain/apple.txt)"
          test -n "$rust_version"
          # What build_spatial.py runs, named instead of left to a profile:
          # rustc and cargo, and rust-std for every target spatialTarget()
          # returns (only the slices with spatial audio build Rust).
          rustup toolchain install "$rust_version" --profile minimal --no-self-update \
            --component rustc,cargo,rust-std \
            --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-tvos,aarch64-apple-tvos-sim
          # build_spatial.py resolves the toolchain's rustc through rustup, so
          # no proxy has to be on the driver's PATH.
          rustup which --toolchain "$rust_version" rustc
          rustup which --toolchain "$rust_version" cargo

      - name: Build GPL version (${{ matrix.name }})
        timeout-minutes: 60
        run: |
          make build use-prebuilt libs=${{ needs.plan.outputs.stale_apple }} platform=${{ matrix.platforms }}

      - name: Require Plezy ordered PCM ABI (${{ matrix.platform_type }})
        if: contains(format(',{0},', needs.plan.outputs.stale_apple), ',libmpv,')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("dist/libmpv/${{ matrix.platform_type }}/thin/"*/lib/libmpv.a)
          if (( ${#archives[@]} == 0 )); then
            echo "No libmpv archives were produced for ${{ matrix.platform_type }}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            python3 scripts/check_plezy_audio_tap_export.py "$archive"
          done

      # Each spatial slice: the prelinked core's exports, a link with libdovi's
      # Rust runtime force-loaded, and an Objective-C consumer through the
      # packaged mpv.pc. Slices without spatial audio are skipped. Only a leg
      # that compiled libmpv has the patched source and packaged mpv.pc this
      # needs; a libmpv restored from its published zips was checked when it
      # was built. stale_apple has no delimiters, so add them for an exact test.
      - name: Check spatial slices and combined archive links (${{ matrix.platform_type }})
        if: contains(format(',{0},', needs.plan.outputs.stale_apple), ',libmpv,')
        shell: bash
        run: |
          mpv_version="$(python3 -c 'import json; print(json.load(open("versions.json"))["components"]["mpv"]["version"])')"
          bash scripts/test_spatial_archives.sh "dist/libmpv-$mpv_version" "${{ matrix.platform_type }}"

      - name: Name per-platform binaries by content (${{ matrix.platform_type }})
        run: |
          python3 scripts/keys.py record-platform \
            --platform-group apple \
            --platform ${{ matrix.platform_type }} \
            --release-dir dist/release

      # A rebuild of a published key has to reproduce its bytes (publish-assets
      # refuses anything else), so no file may carry a build's clock. A stamp
      # publishes fine once and fails only the rebuild, weeks later.
      - name: Check the zips for a build date (${{ matrix.name }})
        run: bash scripts/test_build_date.sh dist/release/*.zip

      - name: Upload platform build (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.name }}
          path: |
            ./dist/release/*.zip
            ./dist/release/*.checksum.txt
          if-no-files-found: error

  publish-apple:
    name: Publish apple
    needs: [build-apple, build-linux-arm64, tests]
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        always() && !cancelled() && needs.tests.result == 'success' && needs.build-apple.result == 'success'
      )
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/python@3.12/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: apple-*
          path: ./dist/partials

      - name: Merge platform XCFrameworks
        run: python3 scripts/merge_xcframeworks.py dist/partials dist/release

      - name: Verify the real AVFoundation shader implementation in every slice
        run: python3 scripts/verify_avf_shaders.py dist/release/Libmpv.xcframework.zip

      - name: Check the merged XCFrameworks for a build date
        run: bash scripts/test_build_date.sh dist/release/*.zip

      - name: Name frameworks by content and record them
        run: python3 scripts/keys.py record-frameworks --platform-group apple --release-dir dist/release

      - name: Render Package.swift from the manifest
        run: python3 scripts/keys.py render --platform-group apple

      - name: Verify manifest matches this commit
        run: python3 scripts/keys.py verify --platform-group apple

      # Pinned by release and archive checksum, since it gates publish-assets.
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Link Objective-C-only SwiftPM consumers on iOS and tvOS
        run: bash scripts/test_spatial_swiftpm.sh dist/release

      - name: Upload binaries that are not published yet
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/keys.py publish-assets --platform-group apple

      - name: Upload manifest for the commit job
        uses: actions/upload-artifact@v4
        with:
          name: manifest-apple
          path: |
            ./artifacts.json
            ./Package.swift
          if-no-files-found: error

  build-android:
    name: Build android
    needs: plan
    if: github.event_name != 'schedule' && contains(needs.plan.outputs.stale_groups, ',android,')
    permissions:
      contents: read
      actions: read
    # The tarball legs only when libmpv-android is stale; the AAR always, from
    # this run's tarballs or the published ones artifacts.json pins.
    uses: ./.github/workflows/android.yml
    with:
      natives: ${{ contains(needs.plan.outputs.stale_android, ',libmpv-android,') }}

  build-linux-x64:
    name: Build linux x86_64
    needs: plan
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        contains(needs.plan.outputs.stale_groups, ',linux,')
      )
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim unused hosted runner image space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/local/share/chromium

      # The image digest pins the same container toolchain used for the
      # published x86_64 artifacts. This build always uses hosted Ubuntu.
      - name: Build and package in the pinned container
        run: |
          KEY="$(python3 scripts/keys.py keys --platform-group linux \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["libmpv-linux"])')"
          KEY="${KEY}" ARCH=x86_64 bash platforms/linux/container-build.sh

      - name: Check the tarball and symbols for a build date
        run: |
          bash scripts/test_build_date.sh dist/release/*.tar.zst \
            dist/release/libmpv-linux-x86_64-symbols.zip

      - name: Upload platform build
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ./dist/release/*.tar.zst
            ./dist/release/codec-inventory-*.json
            ./dist/release/codec-playback-*.json
            ./dist/release/libmpv-linux-x86_64-symbols.zip
          if-no-files-found: error

  build-linux-arm64:
    name: Build linux aarch64
    needs: [plan]
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        contains(needs.plan.outputs.stale_groups, ',linux,')
      )
    permissions:
      contents: read
    # Native public Linux ARM64 removes the former Mac, Colima, Tailnet and NFS dependency.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim unused hosted runner image space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/local/share/chromium

      - name: Build and package in the pinned container
        env:
          JOBS: '4'
        run: |
          KEY="$(python3 scripts/keys.py keys --platform-group linux \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["libmpv-linux"])')"
          KEY="${KEY}" ARCH=aarch64 bash platforms/linux/container-build.sh

      - name: Check the tarball and symbols for a build date
        run: |
          bash scripts/test_build_date.sh dist/release/*.tar.zst \
            dist/release/libmpv-linux-aarch64-symbols.zip

      - name: Upload platform build
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            ./dist/release/*.tar.zst
            ./dist/release/codec-inventory-*.json
            ./dist/release/codec-playback-*.json
            ./dist/release/libmpv-linux-aarch64-symbols.zip
          if-no-files-found: error

  prepare-windows-host-llvm:
    name: Prepare shared Windows host LLVM
    needs: [plan]
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      contains(needs.plan.outputs.stale_groups, ',windows,')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.host-llvm.outputs.sha256 }}
      llvm_commit: ${{ steps.pins.outputs.llvm_commit }}
      winbuild_commit: ${{ steps.pins.outputs.winbuild_commit }}
      cache_hit: ${{ steps.host-llvm-archive.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim unused hosted runner image space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/local/share/chromium

      - name: Resolve Windows and LLVM source pins
        id: pins
        run: |
          read -r winbuild_url winbuild_commit < <(python3 platforms/windows/pin_packages.py --print-winbuild-pin)
          echo "winbuild_url=${winbuild_url}" >> "$GITHUB_OUTPUT"
          echo "winbuild_commit=${winbuild_commit}" >> "$GITHUB_OUTPUT"
          llvm_commit="$(python3 -c 'import json; d=json.load(open("versions.json"))["components"]["llvm"]; print(d.get("overrides", {}).get("windows", {}).get("commit", d["commit"]))')"
          echo "llvm_commit=${llvm_commit}" >> "$GITHUB_OUTPUT"

      - name: Restore shared host LLVM archive
        id: host-llvm-archive
        uses: actions/cache/restore@v4
        with:
          path: .cache/windows/host-llvm.tar.gz
          key: windows-host-llvm-v1-${{ steps.pins.outputs.llvm_commit }}-${{ steps.pins.outputs.winbuild_commit }}-${{ hashFiles('toolchain/windows.txt', 'platforms/windows/host_llvm_cache.py', 'platforms/windows/install-build-dependencies.sh') }}

      - name: Restore a completed Windows toolchain as an LLVM donor
        if: steps.host-llvm-archive.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows/aarch64
            build/windows/src
            build/windows/rustup
          key: windows-host-llvm-donor-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-ep4-aarch64-
            windows-ep3-aarch64-
            windows-ep2-aarch64-

      - name: Repair restored Windows workspace path
        if: steps.host-llvm-archive.outputs.cache-hit != 'true'
        run: python3 scripts/windows_cache_workspace.py aarch64

      - name: Install Windows build dependencies
        if: steps.host-llvm-archive.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: bash platforms/windows/install-build-dependencies.sh

      - name: Export the restored host compiler
        id: host-llvm
        env:
          HOST_LLVM_CACHE_HIT: ${{ steps.host-llvm-archive.outputs.cache-hit }}
          WINBUILD_URL: ${{ steps.pins.outputs.winbuild_url }}
          WINBUILD_COMMIT: ${{ steps.pins.outputs.winbuild_commit }}
        run: |
          set -euo pipefail
          if [[ "$HOST_LLVM_CACHE_HIT" != true ]]; then
            mkdir -p .cache/windows
            windows_root="${MPV_WINDOWS_WORKSPACE:-$GITHUB_WORKSPACE}"
            build_root="$windows_root/build/windows/aarch64"
            llvm_source="$windows_root/build/windows/src/llvm"
            prefix="$build_root/install"
            stamps="$build_root/toolchain/llvm-prefix/src/llvm-stamp"
            winbuild_source="$windows_root/build/windows/mpv-winbuild-cmake"

            # A completed Windows build already contains the host compiler.
            # Export it before running build.sh: winbuild drops LLVM stamps
            # when its checkout is missing and would otherwise rebuild LLVM
            # from scratch for hours just to recreate the same compiler.
            if [[ ! -x "$prefix/bin/llvm" ]]; then
              echo "No completed LLVM compiler in the restored donor; bootstrapping it once."
              bash platforms/windows/build.sh aarch64 --host-llvm-only
            fi

            if [[ ! -d "$llvm_source/.git" ]]; then
              if [[ -e "$llvm_source" ]]; then
                rmdir "$llvm_source" || {
                  echo "LLVM source path exists without a Git checkout: $llvm_source" >&2
                  exit 1
                }
              fi
              python3 scripts/patches.py fetch-pinned llvm windows "$llvm_source"
            fi

            # The donor cache contains build/windows/aarch64 and build/windows/src,
            # but not the sibling winbuild checkout. Fetch its pinned commit
            # directly: upstream master moved past the frozen commit in versions.json.
            if [[ ! -d "$winbuild_source/.git" ]]; then
              if [[ -e "$winbuild_source" ]]; then
                rmdir "$winbuild_source" || {
                  echo "Windows source path exists without a Git checkout: $winbuild_source" >&2
                  exit 1
                }
              fi
              git init --quiet "$winbuild_source"
              git -C "$winbuild_source" remote add origin "$WINBUILD_URL"
              git -C "$winbuild_source" fetch --quiet --depth 1 origin "$WINBUILD_COMMIT"
              git -C "$winbuild_source" checkout --quiet --detach FETCH_HEAD
            fi

            test -d "$winbuild_source/.git"
            test "$(git -C "$winbuild_source" rev-parse HEAD)" = "$WINBUILD_COMMIT"
            test -s "$stamps/llvm-install-out.log"
            python3 platforms/windows/host_llvm_cache.py export \
              --archive .cache/windows/host-llvm.tar.gz \
              --prefix "$prefix" \
              --stamps "$stamps" \
              --winbuild "$winbuild_source" \
              --source "$llvm_source" \
              --image ubuntu-24.04
          fi
          test -s .cache/windows/host-llvm.tar.gz
          echo "sha256=$(sha256sum .cache/windows/host-llvm.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload shared host LLVM archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-llvm
          path: .cache/windows/host-llvm.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build windows ${{ matrix.arch }}
    needs: [plan, prepare-windows-host-llvm]
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        contains(needs.plan.outputs.stale_groups, ',windows,')
      )
    permissions:
      contents: read
    # Both target arches cross-compile from an x86_64 host: winbuild's
    # GCC_ARCH probe runs the HOST compiler with -march=x86-64 and fails on
    # arm64 hosts, and aarch64-w64-mingw32 only needs the clang toolchain,
    # which build.sh hardcodes.
    # Pinned to the host environment the cached toolchain was built on: the
    # LLVM bootstrap links host clang against libc++, so the pinned apt and
    # pip toolchain below supplies the matching compiler libraries. Both
    # Windows targets cross-compile on public x64 Ubuntu.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim unused hosted runner image space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/local/share/chromium

      - name: Install dependencies
        timeout-minutes: 20
        run: bash platforms/windows/install-build-dependencies.sh

      # pin_packages.py is the one place that resolves the windows pin, so the
      # cache key below cannot describe a different commit than build.sh
      # fetches.
      - name: Resolve the winbuild pin
        id: winbuild
        run: |
          read -r _ commit < <(python3 platforms/windows/pin_packages.py --print-winbuild-pin)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # Each per-arch dependency graph builds ~60 packages, so preserve its
      # sources, stamps, installed prefix and ccache as one build-state cache.
      # prepare-windows-host-llvm supplies the separately validated host
      # compiler; this cache retains target runtimes, sysroots and package
      # state. Skipping is stamp-driven ninja:
      # an ExternalProject step re-runs only when its stamp is missing/older
      # or its command line changed, and ninja treats an edge absent from
      # .ninja_log as changed -- so the per-arch tree (stamps + .ninja_log +
      # installed prefix + ccache) is the unit of caching, not a hand-picked
      # subset. pin_packages.py suppresses upstream's check-git step, which
      # is otherwise absent from cold graphs and cascades a full rebuild on
      # its first warm appearance.
      # Correctness of reuse: dep sources can only move through the winbuild
      # commit, and the three packages pin_packages.py rewrites get new step
      # command lines whenever versions.json pins or the patch series change,
      # which dirties exactly those packages; build.sh fullcleans mpv every
      # run (upstream's BUILDDATE naming dirties its packaging steps daily,
      # and libmpv must relink against whatever changed underneath it anyway)
      # and always runs the toolchain targets -- no-ops when clean -- which
      # makes the pin-free restore tier safe across winbuild bumps. Keep one
      # immutable cache per arch and input set. Stable inputs precede the
      # driver hash so driver-only edits keep restoring compatible trees.
      # EP3/EP2 fallbacks migrate caches made before this key layout.
      - name: Restore build state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows/${{ matrix.arch }}
            build/windows/src
            build/windows/rustup
          key: windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('versions.json', 'patches/**') }}-${{ hashFiles('platforms/windows/build.sh', 'platforms/windows/pin_packages.py', 'platforms/windows/host_llvm_cache.py', 'platforms/windows/install-build-dependencies.sh') }}
          restore-keys: |
            windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('versions.json', 'patches/**') }}-
            windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-
            windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-
            windows-ep4-${{ matrix.arch }}-
            windows-ep3-${{ matrix.arch }}-
            windows-ep2-${{ matrix.arch }}-

      - name: Repair restored Windows workspace path
        run: python3 scripts/windows_cache_workspace.py "${{ matrix.arch }}"

      - name: Download shared host LLVM archive
        uses: actions/download-artifact@v4
        with:
          name: windows-host-llvm
          path: .cache/windows

      # shaderc/glslang's doc.cpp compile used about 7 GiB by itself on the
      # Ubuntu 24.04 hosted runner. Add disk-backed swap for compiler memory
      # spikes while retaining free space for build and package outputs.
      - name: Add temporary swap for compiler memory spikes
        shell: bash
        run: |
          set -euo pipefail
          swap_file=/var/tmp/gha-windows-build.swap
          swap_size_gib=8
          keep_free_gib=4
          available_kib="$(df -Pk /var/tmp | awk 'NR == 2 {print $4}')"
          required_kib="$(( (swap_size_gib + keep_free_gib) * 1024 * 1024 ))"
          if (( available_kib < required_kib )); then
            echo "need $((swap_size_gib + keep_free_gib)) GiB free on /var/tmp for compiler swap and build outputs; found $((available_kib / 1024 / 1024)) GiB" >&2
            exit 1
          fi
          sudo fallocate -l "${swap_size_gib}G" "$swap_file"
          sudo chmod 0600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          sudo sysctl vm.swappiness=100
          free -h
          swapon --show
          df -h /var/tmp

      - name: Build libmpv-windows (${{ matrix.arch }})
        env:
          PLEZY_WINDOWS_HOST_LLVM_CACHE: .cache/windows/host-llvm.tar.gz
          PLEZY_WINDOWS_HOST_LLVM_SHA256: ${{ needs.prepare-windows-host-llvm.outputs.sha256 }}
          PLEZY_WINDOWS_HOST_LLVM_IMAGE: ubuntu-24.04
        run: bash platforms/windows/build.sh ${{ matrix.arch }}

      - name: Require Plezy ordered PCM ABI (${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          dev_dir="$(find "build/windows/${{ matrix.arch }}" -maxdepth 1 -type d -name 'mpv-dev-*' -print -quit)"
          test -n "$dev_dir" || { echo "mpv-dev package was not produced" >&2; exit 1; }
          python3 scripts/check_plezy_audio_tap_export.py "$dev_dir/libmpv-2.dll"

      # package.sh names the zip by content key itself, so the build leg
      # uploads it as-is; publish records every variant at once. Beside it
      # goes the unkeyed libmpv-windows-<arch>-symbols.zip (libmpv-2.pdb),
      # which record-platform names by the same key; *.zip below carries it.
      - name: Package dev zip and symbols (${{ matrix.arch }})
        run: bash platforms/windows/package.sh ${{ matrix.arch }}

      # A rebuild of a published key has to reproduce its bytes (publish-assets
      # refuses anything else), so no file may carry a build's clock. The scan
      # reaches back to 2020: a restored build tree keeps the stamps of the
      # runs that compiled each package, weeks before this one.
      - name: Check the zips for a build date (${{ matrix.arch }})
        run: bash scripts/test_build_date.sh dist/release/*.zip

      - name: Save build state cache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: |
            build/windows/${{ matrix.arch }}
            build/windows/src
            build/windows/rustup
          key: windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('versions.json', 'patches/**') }}-${{ hashFiles('platforms/windows/build.sh', 'platforms/windows/pin_packages.py', 'platforms/windows/host_llvm_cache.py', 'platforms/windows/install-build-dependencies.sh') }}

      - name: Upload platform build (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: ./dist/release/*.zip
          if-no-files-found: error

  save-windows-host-llvm-cache:
    name: Save shared Windows host LLVM cache
    needs: [plan, prepare-windows-host-llvm, build-windows]
    if: >-
      always() &&
      needs.prepare-windows-host-llvm.result == 'success' &&
      needs.prepare-windows-host-llvm.outputs.cache_hit != 'true' &&
      contains(needs.plan.outputs.stale_groups, ',windows,')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: windows-host-llvm
          path: .cache/windows

      - name: Save shared host LLVM archive
        uses: actions/cache/save@v4
        with:
          path: .cache/windows/host-llvm.tar.gz
          key: windows-host-llvm-v1-${{ needs.prepare-windows-host-llvm.outputs.llvm_commit }}-${{ needs.prepare-windows-host-llvm.outputs.winbuild_commit }}-${{ hashFiles('toolchain/windows.txt', 'platforms/windows/host_llvm_cache.py', 'platforms/windows/install-build-dependencies.sh') }}

  windows-cache-keepalive:
    name: Keep Windows cache (${{ matrix.arch }})
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action_tag == 'keep-windows-cache' &&
          inputs.runner_pool_tag != ''
        )
      )
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the winbuild pin
        id: winbuild
        run: |
          read -r _ commit < <(python3 platforms/windows/pin_packages.py --print-winbuild-pin)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

          llvm_commit="$(python3 -c 'import json; d=json.load(open("versions.json"))["components"]["llvm"]; print(d.get("overrides", {}).get("windows", {}).get("commit", d["commit"]))')"
          echo "llvm_commit=${llvm_commit}" >> "$GITHUB_OUTPUT"

      # GitHub caps this repository's cache retention at seven days. Restoring
      # twice a week refreshes last access without running a build.
      - name: Refresh Windows build state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows/${{ matrix.arch }}
            build/windows/src
            build/windows/rustup
          key: windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('versions.json', 'patches/**') }}-${{ hashFiles('platforms/windows/build.sh', 'platforms/windows/pin_packages.py', 'platforms/windows/host_llvm_cache.py', 'platforms/windows/install-build-dependencies.sh') }}
          restore-keys: |
            windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('versions.json', 'patches/**') }}-
            windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-
            windows-ep4-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-
            windows-ep4-${{ matrix.arch }}-
            windows-ep3-${{ matrix.arch }}-
            windows-ep2-${{ matrix.arch }}-

      - name: Refresh shared host LLVM archive
        if: matrix.arch == 'x86_64'
        uses: actions/cache/restore@v4
        with:
          path: .cache/windows/host-llvm.tar.gz
          key: windows-host-llvm-v1-${{ steps.winbuild.outputs.llvm_commit }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('toolchain/windows.txt', 'platforms/windows/host_llvm_cache.py', 'platforms/windows/install-build-dependencies.sh') }}

  publish:
    name: Publish ${{ matrix.group }}
    # One recipe for every group.json group. The only per-group inputs are data:
    # the group name and its artifact glob, both of which come from the group's
    # own group.json (via `keys.py groups`/`variants`) rather than being
    # restated here.
    needs: [plan, build-android, build-linux-x64, build-linux-arm64, build-windows, tests]
    # always(): a group with nothing stale has a *skipped* build job, and a
    # skipped need would otherwise skip this job -- silently publishing nothing
    # and leaving the commit unpinnable. The per-row gate below decides which
    # rows actually act; `!cancelled()` keeps a superseded run from publishing.
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        always() && !cancelled() && needs.tests.result == 'success' && needs.plan.outputs.stale_groups != ''
      )
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: android
            artifacts: android-*
          - group: linux
            artifacts: linux-*
          - group: windows
            artifacts: windows-*
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Provision and verify artifact tools
        shell: bash
        run: bash scripts/prepare_linux_artifacts.sh --public

      # A group with nothing stale keeps its committed section and is skipped
      # rather than published; the manifest job's gate below is what proves
      # every stale group got here.
      - name: Skip groups with nothing stale
        id: stale
        run: |
          if [[ "${{ needs.plan.outputs.stale_groups }}" == *",${{ matrix.group }},"* ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.group }}: nothing stale, keeping the committed section"
          fi

      # actions/download-artifact has no fail-on-empty input: a pattern that
      # matches nothing logs "Total of 0 artifact(s) downloaded" and succeeds,
      # and record-platform below only records what exists. The run is still
      # closed by `keys.py verify` two steps down: it fails whenever the
      # manifest does not describe the artifacts this commit has to publish.
      - name: Download platform builds
        if: steps.stale.outputs.stale == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.artifacts }}
          path: ./dist/partials

      - name: Collect release assets
        if: steps.stale.outputs.stale == 'true'
        run: |
          mkdir -p dist/release
          find dist/partials -type f -exec cp -v {} dist/release/ \;

      # For group.json groups record-platform is the verb that writes the
      # manifest section, so it runs here -- once per variant against the
      # merged release dir -- not in the build legs, whose partial manifests
      # would each carry a single variant. record-packages then names and
      # records the group's package artifacts (android: the mpv-android AAR;
      # nothing for a group without one). Both name and record each artifact's
      # debug-symbols zips (linux, windows: one per arch; android: the AAR's,
      # one per ABI) and fail when a recorded asset arrived without them.
      - name: Record variants in the manifest
        if: steps.stale.outputs.stale == 'true'
        run: |
          # Capture the substitution instead of inlining it: a command
          # substitution in a `for` word list does not propagate its exit
          # status, even under `set -eo pipefail` -- the failed substitution
          # expands to an empty list and the loop body never runs, which
          # reports success. A keys.py traceback would then record zero
          # variants and look like a group with nothing to record.
          variants="$(python3 scripts/keys.py variants --platform-group ${{ matrix.group }})"
          if [ -z "${variants}" ]; then
            echo "FAIL: no variants for ${{ matrix.group }}" >&2
            exit 1
          fi
          for variant in ${variants}; do
            python3 scripts/keys.py record-platform \
              --platform-group ${{ matrix.group }} \
              --platform "${variant}" \
              --release-dir dist/release
          done
          python3 scripts/keys.py record-packages \
            --platform-group ${{ matrix.group }} \
            --release-dir dist/release

      - name: Verify manifest matches this commit
        if: steps.stale.outputs.stale == 'true'
        run: python3 scripts/keys.py verify --platform-group ${{ matrix.group }}

      - name: Upload binaries that are not published yet
        if: steps.stale.outputs.stale == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/keys.py publish-assets --platform-group ${{ matrix.group }}

      - name: Upload manifest for the commit job
        if: steps.stale.outputs.stale == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.group }}
          path: ./artifacts.json
          if-no-files-found: error

  manifest:
    name: Commit manifest
    # All-or-nothing composition: every group the plan job marked stale must
    # have published a manifest, and at least one group must have published
    # (all-clean runs have nothing to splice and are fully verified by the plan
    # job). The gate reads the plan's stale list and the downloaded manifests
    # rather than restating per-group job names, so a group added to
    # platforms/*/group.json cannot be silently skipped.
    needs: [plan, publish-apple, publish, tests]
    # always(): this gate is what proves a group that was stale actually
    # published, so it must run even when one of them failed.
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'build' &&
          inputs.runner_pool_tag != ''
        )
      ) &&
      (
        always() && !cancelled() && needs.tests.result == 'success' && needs.plan.outputs.stale_groups != ''
      )
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download group manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: ./dist/manifests

      - name: Check every stale group published
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          # ",apple,android," -> ["apple", "android"]
          stale = [g for g in os.environ['STALE_GROUPS'].strip(',').split(',') if g]
          present = {p.name[len('manifest-'):] for p in Path('dist/manifests').glob('manifest-*')}
          missing = [group for group in stale if group not in present]
          if missing:
              print(f'FAIL: {", ".join(missing)} was stale but published no manifest')
              raise SystemExit(1)
          print(f'every stale group published: {", ".join(stale)}')
          PY
        env:
          STALE_GROUPS: ${{ needs.plan.outputs.stale_groups }}

      # Each group's publish job rewrote only its own platforms.<group> section
      # of artifacts.json (keys.py re-serializes the rest untouched), so
      # splicing every downloaded section into the checked-out manifest
      # composes the groups. The serialization below matches keys.py
      # save_manifest byte for byte.
      - name: Splice group sections into artifacts.json
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest_path = Path('artifacts.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          partials = sorted(Path('dist/manifests').glob('manifest-*'))
          if not partials:
            raise SystemExit('no group manifests were downloaded')

          for partial in partials:
            group = partial.name[len('manifest-'):]
            data = json.loads((partial / 'artifacts.json').read_text(encoding='utf-8'))
            manifest['platforms'][group] = data['platforms'][group]
            print(f'spliced platforms.{group}')
            if group == 'apple':
              # Package.swift is rendered from the apple section alone.
              shutil.copy2(partial / 'Package.swift', 'Package.swift')

          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Check for manifest changes
        id: changes
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- Package.swift artifacts.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # No pull/rebase before this: if main moved while the binaries were
      # building, this run is superseded and its push is meant to be rejected.
      # Rebasing would land a manifest computed from an older tree on top of the
      # newer one, which is exactly the skew `verify` exists to prevent; the
      # queued run for the newer commit publishes the right manifest instead.
      # The assets uploaded above are content-addressed, so that run reuses them.
      - name: Push binary manifest
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: |
            - Package.swift
            - artifacts.json
          message: "chore: binaries for ${{ steps.changes.outputs.short_sha }} [skip binaries]"
          push: "origin HEAD:${{ github.ref_name }}"
