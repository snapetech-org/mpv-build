name: Android build

# The android group's build, one definition for publish.yml and ci.yml: the
# four libmpv-android tarballs, then the
# mpv-android AAR
# that packs them with the JNI glue. Nothing here records, uploads to a
# release or commits; the callers do that from the workflow artifacts:
#
#   android-<abi>  the unkeyed tarball dist/release/libmpv-android-<abi>.tar.gz
#   android-aar    the unkeyed dist/release/mpv-android.aar and its debug
#                  symbols, dist/release/mpv-android-<abi>-symbols.zip per ABI
#   device-test-android  (device-tests only) the AAR's androidTest APK; named
#                  off the android-* glob the publish job collects
on:
  workflow_call:
    inputs:
      natives:
        description: >-
          Build the four tarballs. False when the libmpv-android key at this
          commit is published already: the AAR then packs the published
          tarballs artifacts.json pins.
        type: boolean
        required: true
      runner-pool:
        description: Compatible runner pool; existing private callers remain supported
        type: string
        default: private
      reuse-arm64-run:
        description: Trusted successful starter run with the same native Android content key
        type: string
        default: ''
      reuse-x86-run:
        description: Trusted prior run containing a successful x86 native build
        type: string
        default: ''
      reuse-native-run:
        description: Reassemble all four successful native ABI artifacts without recompiling
        type: string
        default: ''
      device-tests:
        description: Also build the device tests' APK and upload it.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  natives:
    name: Build android ${{ matrix.abi }}
    if: inputs.natives
    # The Android NDK is pinned. nasm, meson and autotools come from the
    # private JIT image, and the release artifacts must reproduce those inputs.
    runs-on: ${{ inputs.runner-pool == 'public' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-{1}-natives"]}}', github.run_id, strategy.job-index)) }}
    timeout-minutes: 120
    # One job per ABI: the driver builds one architecture per --arch invocation
    # (platforms/android/build.sh), the ABIs share nothing but sources, and the
    # dependency graph is expensive enough that four runners beat one.
    strategy:
      fail-fast: false
      matrix:
        # arch is the driver's spelling (loadarch.sh), abi the group.json
        # variant the tarball and the manifest are named by.
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: armv7l
            abi: armeabi-v7a
          - arch: x86
            abi: x86
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the reusable native run
        if: inputs.reuse-native-run != '' || (matrix.abi == 'arm64-v8a' && inputs.reuse-arm64-run != '') || (matrix.abi == 'x86' && inputs.reuse-x86-run != '')
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ matrix.abi == 'arm64-v8a' && inputs.reuse-arm64-run != '' && inputs.reuse-arm64-run || inputs.reuse-native-run != '' && inputs.reuse-native-run || inputs.reuse-x86-run }}
          REUSE_ABI: ${{ matrix.abi }}
          REUSE_ALL: ${{ inputs.reuse-native-run != '' && !(matrix.abi == 'arm64-v8a' && inputs.reuse-arm64-run != '') }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          run_id = os.environ['REUSE_RUN']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('reuse run must be a numeric GitHub run ID')
          repo = os.environ['GITHUB_REPOSITORY']
          data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          if data['head_repository']['full_name'] != repo:
              raise SystemExit('reuse requires a run from this trusted repository')
          abi = os.environ['REUSE_ABI']
          if abi == 'arm64-v8a' and os.environ['REUSE_ALL'] != 'true':
              jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
              if not any(job['name'] == 'android-arm64' and job['conclusion'] == 'success' for job in jobs):
                  raise SystemExit('the ARM64 starter job must have succeeded')
              artifact = 'bundled-android-arm64'
          else:
              jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
              name = 'Build android ' + abi
              if not any((job['name'] == name or job['name'].endswith(' / ' + name)) and job['conclusion'] == 'success' for job in jobs):
                  raise SystemExit('the prior native ABI build must have succeeded: ' + abi)
              artifact = 'android-' + abi
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('sha=' + data['head_sha'], file=output)
              print('run=' + run_id, file=output)
              print('artifact=' + artifact, file=output)
          PYCODE
      - uses: actions/checkout@v4
        if: steps.reuse.outputs.sha != ''
        with:
          ref: ${{ steps.reuse.outputs.sha }}
          path: previous-native-inputs
          persist-credentials: false
      - name: Verify reusable artifact content keys
        if: steps.reuse.outputs.sha != ''
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          def keys(script):
              return json.loads(subprocess.check_output(['python3', script, 'keys', '--platform-group', 'android']))
          if keys('scripts/keys.py')['libmpv-android'] != keys('previous-native-inputs/scripts/keys.py')['libmpv-android']:
              raise SystemExit('prior Android artifacts have different source/build inputs; refusing reuse')
          PYCODE
      - uses: actions/download-artifact@v4
        if: steps.reuse.outputs.sha != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.reuse.outputs.run }}
          name: ${{ steps.reuse.outputs.artifact }}
          path: dist/release

      # sdkmanager is a Java program, even though the native cross-build no
      # longer uses Gradle or the Android platform/build-tools packages.
      - name: Set up Java for Android SDK manager
        if: steps.reuse.outputs.sha == ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Java for private runner downloads
        if: steps.reuse.outputs.sha == '' && inputs.runner-pool != 'public'
        run: python3 scripts/prepare_android_java.py proxy

      # Host build tools from apt plus the exact NDK pinned in
      # toolchain/android.txt (part of every android content key).
      - uses: actions/cache/restore@v4
        if: steps.reuse.outputs.sha == ''
        id: ndk-cache
        with:
          path: platforms/android/sdk
          key: dv-android-sdk-${{ runner.os }}-${{ hashFiles('toolchain/android.txt') }}
      - name: Install host toolchain and pinned NDK
        if: steps.reuse.outputs.sha == ''
        run: bash platforms/android/include/download-sdk.sh
      - uses: actions/cache/save@v4
        if: steps.reuse.outputs.sha == '' && steps.ndk-cache.outputs.cache-hit != 'true'
        with:
          path: platforms/android/sdk
          key: dv-android-sdk-${{ runner.os }}-${{ hashFiles('toolchain/android.txt') }}

      - name: Install pinned Rust for libdovi
        if: steps.reuse.outputs.sha == ''
        run: bash scripts/install_pinned_rustup_linux.sh

      - name: Fetch and patch pinned sources
        if: steps.reuse.outputs.sha == ''
        run: |
          if [[ '${{ inputs.runner-pool }}' == public ]]; then
            python3 scripts/prepare_android_lua.py
          fi
          bash platforms/android/download.sh

      - name: Build libmpv-android (${{ matrix.abi }})
        if: steps.reuse.outputs.sha == ''
        run: bash platforms/android/build.sh --arch ${{ matrix.arch }}

      - name: Require Plezy ordered PCM ABI (${{ matrix.abi }})
        if: steps.reuse.outputs.sha == ''
        run: python3 scripts/check_plezy_audio_tap_export.py "platforms/android/prefix/${{ matrix.abi }}/lib/libmpv.so"

      - name: Require ordered PCM in reused native package (${{ matrix.abi }})
        if: steps.reuse.outputs.sha != ''
        run: python3 scripts/inspect_pcm_package.py "dist/release/libmpv-android-${{ matrix.abi }}.tar.gz" --expected 1 --motion-platform android

      # package.sh emits the unkeyed name (libmpv-android-<abi>.tar.gz): the
      # content key covers the published driver, which this leg cannot know is
      # final yet. The build leg uploads it as-is and record-platform renames
      # it to the group.json assetPattern's content-addressed spelling.
      - name: Package per-ABI tarball (${{ matrix.abi }})
        if: steps.reuse.outputs.sha == ''
        run: bash platforms/android/package.sh --arch ${{ matrix.arch }}

      # A rebuild of a published key has to reproduce its bytes (publish-assets
      # refuses anything else), so no file may carry a build's clock. A stamp
      # publishes fine once and fails only the rebuild, weeks later.
      - name: Check the tarball for a build date (${{ matrix.abi }})
        run: bash scripts/test_build_date.sh dist/release/libmpv-android-${{ matrix.abi }}.tar.gz

      - name: Upload platform build (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: ./dist/release/*.tar.gz
          if-no-files-found: error

  aar:
    name: Build mpv-android AAR
    needs: natives
    # always(): natives is skipped when the tarballs are published already;
    # a failed tarball leg leaves nothing to pack.
    if: always() && !cancelled() && needs.natives.result != 'failure'
    runs-on: ${{ inputs.runner-pool == 'public' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-aar"]}}', github.run_id)) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Provision and verify artifact tools
        shell: bash
        run: bash scripts/prepare_linux_artifacts.sh ${{ inputs.runner-pool == 'public' && '--public' || '' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Java does not consume HTTPS_PROXY. Configure it before setup-android
      # invokes sdkmanager, and retain the same settings for Gradle and its JVMs.
      - name: Configure Java for private runner downloads
        if: inputs.runner-pool != 'public'
        run: python3 scripts/prepare_android_java.py proxy

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false

      - name: Install and verify the AAR SDK toolchain
        run: python3 scripts/prepare_android_java.py sdk ${{ inputs.runner-pool == 'public' && '--public' || '' }}

      - name: Download the tarballs this run built
        if: needs.natives.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: android-*
          path: ./dist/tarballs
          merge-multiple: true

      # The JVM tests ride along: they need no tarball, and a failure stops the
      # AAR. Gradle installs the pinned NDK and CMake into the runner's SDK.
      - name: Build the AAR and run its JVM tests
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALLS: ${{ needs.natives.result == 'success' && 'dist/tarballs' || '' }}
          DEVICE_TESTS: ${{ inputs.device-tests && 'assembleDebugAndroidTest' || '' }}
        run: |
          python3 scripts/run_with_dependency_retry.py -- \
            bash platforms/android/lib/build-aar.sh ${TARBALLS:+--tarballs "$TARBALLS"} \
            -- testDebugUnitTest ${DEVICE_TESTS}

      # The symbols zips are named one by one so a missing ABI fails here,
      # not at record-packages after the merge.
      - name: Check the AAR and its symbols for a build date
        run: |
          bash scripts/test_build_date.sh dist/release/mpv-android.aar \
            dist/release/mpv-android-{arm64-v8a,armeabi-v7a,x86,x86_64}-symbols.zip

      - name: Require Plezy ordered PCM ABI in the AAR
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          unzip -q dist/release/mpv-android.aar 'jni/*/libmpv.so' -d "$staging"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            python3 scripts/check_plezy_audio_tap_export.py "$staging/jni/$abi/libmpv.so"
          done

      - name: List the AAR and its symbols
        run: |
          ls -l dist/release/mpv-android.aar dist/release/mpv-android-*-symbols.zip
          unzip -l dist/release/mpv-android.aar
          for symbols in dist/release/mpv-android-*-symbols.zip; do
            unzip -l "${symbols}"
          done

      - name: Upload the AAR and its symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: |
            ./dist/release/mpv-android.aar
            ./dist/release/mpv-android-*-symbols.zip
          if-no-files-found: error

      - name: Upload the device tests' APK
        if: inputs.device-tests
        uses: actions/upload-artifact@v4
        with:
          name: device-test-android
          path: ./platforms/android/lib/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
