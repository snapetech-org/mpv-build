# ng-runner-policy: private-jit-only-v1
name: Test Build

run-name: >-
  ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Explicit CI action
        required: true
        type: choice
        options: [ci]
      runner_pool_tag:
        description: Explicit private runner pool
        required: true
        type: choice
        options: [private]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) }}
    env:
      # Keep small Python and Rust caches on local APFS for reliable metadata access.
      PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/python@3.12/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify and install pinned Apple build tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in make clang clang++ autoconf automake glibtool ninja python3 xcodebuild xcrun; do
            command -v "$tool" >/dev/null || { echo "missing Apple build tool: $tool" >&2; exit 1; }
          done
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          for sdk in macosx iphoneos iphonesimulator; do
            sdk_path="$(xcrun --sdk "$sdk" --show-sdk-path)"
            test -d "$sdk_path" || { echo "missing Xcode SDK: $sdk" >&2; exit 1; }
          done
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          meson_bin="$RUNNER_TEMP/meson-venv/bin"
          "$meson_bin/python" -m pip install --disable-pip-version-check meson==1.4.2
          echo "$meson_bin" >> "$GITHUB_PATH"
          export PATH="$meson_bin:$PATH"
          meson --version

      - name: Check version to release
        uses: jannekem/run-python-script-action@v1
        with:
          script: |
            import json

            # Pins live in versions.json; the Swift driver reads them from there
            # too, so nothing here parses Swift source.
            with open('./versions.json', 'r', encoding='utf-8') as file:
              components = json.load(file)['components']

            mpvVersion = components['mpv']['version']

            print(f'mpv version: {mpvVersion}')
            print(f'ffmpeg version: {ffmpegVersion}')
            set_env('BUILD_VERSION', mpvVersion)

      - name: Test AO PCM lookahead
        run: ./scripts/test_ao_pcm_lookahead.sh

      - name: Test AO compressed-audio option
        run: ./scripts/test_ao_compressed_audio_option.sh

      - name: Test AVFoundation timebase servo
        run: ./scripts/test_avf_timebase_servo.sh

      - name: Test AVFoundation PiP frame-space OSD
        run: ./scripts/test_avf_pip_frame_space_osd.sh

      - name: Build GPL version
        run: |
          make build platform=maccatalyst,ios,macos

          cd ./dist/release
          python3 - <<'PY'
          from pathlib import Path

          rules = (
              ("*-all.zip", "-all.zip", "-GPL-all.zip"),
              ("*.xcframework.zip", ".xcframework.zip", "-GPL.xcframework.zip"),
              ("*.xcframework.checksum.txt", ".xcframework.checksum.txt", "-GPL.xcframework.checksum.txt"),
          )
          for pattern, suffix, replacement in rules:
              matches = sorted(Path(".").glob(pattern))
              if not matches:
                  raise SystemExit(f"expected GPL output matching {pattern}")
              for source in matches:
                  destination = source.with_name(source.name[:-len(suffix)] + replacement)
                  if destination.exists():
                      raise SystemExit(f"refusing to overwrite {destination}")
                  source.rename(destination)
          PY
