# ng-runner-policy: private-jit-only-v1
name: Test Build

run-name: >-
  ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Explicit CI action
        required: true
        type: choice
        options: [ci]
      runner_pool_tag:
        description: Explicit private runner pool
        required: true
        type: choice
        options: [private]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) }}
    env:
      HOMEBREW_CACHE: /Users/keith/Network/kspls0/plezyng-native-build-20261027/cache/homebrew
      HOMEBREW_LOGS: /Users/keith/Network/kspls0/plezyng-native-build-20261027/cache/homebrew/logs
      HOMEBREW_TEMP: /Users/keith/Network/kspls0/plezyng-native-build-20261027/cache/homebrew/tmp/${{ github.run_id }}-${{ github.run_attempt }}
      PIP_CACHE_DIR: /Users/keith/Network/kspls0/plezyng-native-build-20261027/cache/pip
      CARGO_HOME: /Users/keith/Network/kspls0/plezyng-native-build-20261027/cache/cargo
      RUSTUP_HOME: /Users/keith/Network/kspls0/plezyng-native-build-20261027/cache/rustup
      XDG_CACHE_HOME: /Users/keith/Network/kspls0/plezyng-native-build-20261027/cache/xdg
      TMPDIR: /Users/keith/Network/kspls0/plezyng-native-build-20261027/cache/tmp/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Prepare shared build caches
        shell: bash
        run: |
          set -euo pipefail
          storage_root=/Users/keith/Network/kspls0/plezyng-native-build-20261027
          test -d "$storage_root"
          /sbin/mount | /usr/bin/grep -Fq 'on /Users/keith/Network/kspls0 (smbfs,'
          mkdir -p "$HOMEBREW_CACHE" "$HOMEBREW_LOGS" "$HOMEBREW_TEMP" "$PIP_CACHE_DIR" "$CARGO_HOME" "$RUSTUP_HOME" "$XDG_CACHE_HOME" "$TMPDIR"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check version to release
        uses: jannekem/run-python-script-action@v1
        with:
          script: |
            import json

            # Pins live in versions.json; the Swift driver reads them from there
            # too, so nothing here parses Swift source.
            with open('./versions.json', 'r', encoding='utf-8') as file:
              components = json.load(file)['components']

            mpvVersion = components['mpv']['version']
            ffmpegVersion = components['ffmpeg']['version']
            libplaceboVersion = components['libplacebo']['version']
            vulkanVersion = components['vulkan']['version']

            print(f'mpv version: {mpvVersion}')
            print(f'ffmpeg version: {ffmpegVersion}')
            set_env('BUILD_VERSION', mpvVersion)

            with open('/tmp/RELEASE_NOTE.txt', 'w', encoding='utf-8') as file:
              file.write(f'''
              * mpv version: {mpvVersion} ([changelog](https://github.com/mpv-player/mpv/releases/tag/{mpvVersion}))
              * ffmpeg version: {ffmpegVersion} ([changelog](https://github.com/FFmpeg/FFmpeg/blob/{ffmpegVersion}/Changelog))
              * placebo version: v{libplaceboVersion}
              * MoltenVK version: v{vulkanVersion}
              ''')


      - name: Test AO PCM lookahead
        run: ./scripts/test_ao_pcm_lookahead.sh

      - name: Test AO compressed-audio option
        run: ./scripts/test_ao_compressed_audio_option.sh

      - name: Test AVFoundation timebase servo
        run: ./scripts/test_avf_timebase_servo.sh

      - name: Test AVFoundation PiP frame-space OSD
        run: ./scripts/test_avf_pip_frame_space_osd.sh

      - name: Install dependencies
        run: |
          brew install autoconf
          brew install automake
          brew install libtool
          python -m pip install --break-system-packages --user meson==1.4.2
          meson_bin="$(python -m site --user-base)/bin"
          echo "$meson_bin" >> "$GITHUB_PATH"
          export PATH="$meson_bin:$PATH"
          meson --version
          brew install ninja
          brew install rename

      - name: Build GPL version
        run: |
          make build platform=maccatalyst,ios,macos

          cd ./dist/release
          rename 's/-all\.zip/-GPL-all\.zip/' *-all.zip
          rename 's/\.xcframework\.zip/-GPL\.xcframework\.zip/' *.xcframework.zip
          rename 's/\.xcframework\.checksum\.txt/-GPL\.xcframework\.checksum\.txt/' *.xcframework.checksum.txt
