# ng-runner-policy: private-jit-only-v1
# Public pull requests stay off trusted runners until a disposable,
# secret-free JIT route is available.
name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action_tag, inputs.runner_pool_tag) ||
      format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      action_tag:
        description: Explicit CI action
        required: true
        type: choice
        options: [ci]
      runner_pool_tag:
        description: Explicit private runner pool
        required: true
        type: choice
        options: [private]
      pr_number:
        description: Trusted owner PR number (set only by the metadata dispatcher)
        required: false
        type: string
      pr_sha:
        description: Exact owner PR head SHA
        required: false
        type: string
      target_run_id:
        description: Successful metadata-only pull_request_target run ID
        required: false
        type: string
      pr_author:
        description: Trusted owner PR author login
        required: false
        type: string
      pr_repository:
        description: Same-repository trusted owner PR head repository
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (startsWith(github.event.label.name, 'action:') ||
       startsWith(github.event.label.name, 'pool:')) &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private') &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    # Metadata only: this job never checks out or executes pull request code.
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-packer","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch the requested action from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"]
          pr_repository = os.environ["PR_REPOSITORY"]
          pr_author = os.environ["PR_AUTHOR"]
          target_run_id = os.environ["TARGET_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          labels = json.loads(os.environ["PR_LABELS_JSON"])
          action_labels = [
              label for label in labels
              if isinstance(label, str) and label.startswith("action:")
          ]
          pool_labels = [
              label for label in labels
              if isinstance(label, str) and label.startswith("pool:")
          ]
          if len(action_labels) != 1 or len(pool_labels) != 1:
              raise SystemExit("add exactly one action label and one pool label")
          action = action_labels[0].split(":", 1)[1]
          if action != "ci":
              raise SystemExit("unsupported action label")
          runner_pool = pool_labels[0].split(":", 1)[1]
          if runner_pool != "private":
              raise SystemExit("this workflow requires the private runner pool")
          if (pr_repository.lower() != repository.lower()
                  or pr_author != "snapetech"):
              raise SystemExit("private pool only accepts the repository owner's pull requests")
          if repository != "snapetech-org/mpv-build":
              raise SystemExit("unexpected repository")
          if not re.fullmatch(r"[1-9][0-9]*", number):
              raise SystemExit("invalid pull request number")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          if not re.fullmatch(r"[1-9][0-9]*", target_run_id):
              raise SystemExit("invalid metadata run ID")

          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "action_tag": action,
                  "runner_pool_tag": runner_pool,
                  "pr_number": number,
                  "pr_sha": sha,
                  "target_run_id": target_run_id,
                  "pr_author": pr_author,
                  "pr_repository": pr_repository,
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/mpv-build/actions/workflows/ci.yml/dispatches",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise SystemExit(f"workflow dispatch returned HTTP {response.status}")
          PY

  patches:
    name: Patch series
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action_tag == 'ci' &&
      inputs.runner_pool_tag == 'private' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.pr_number == '' && inputs.pr_sha == '' &&
        inputs.target_run_id == '' && inputs.pr_author == '' &&
        inputs.pr_repository == '') ||
       (inputs.pr_number != '' && inputs.pr_sha != '' &&
        inputs.target_run_id != '' &&
        inputs.pr_author == 'snapetech' &&
        inputs.pr_repository == github.repository &&
       (github.actor == 'snapetech' || github.actor == 'github-actions[bot]')))
    permissions:
      contents: read
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-patches"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pr_repository != '' && inputs.pr_repository || github.repository }}
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Validate patch series
        run: python3 scripts/patches.py check

      - name: Validate private platform toolchain workflows
        run: |
          python3 scripts/test_ci_toolchain_workflows.py
          python3 scripts/test_prepare_android_java.py
          python3 scripts/test_linux_arm64_runtime_workflow.py

      # test_audiotrack_truehd.sh encodes its TrueHD fixtures with the host
      # ffmpeg's truehd encoder and spdif muxer.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test patch framework
        run: bash scripts/test_patches.sh

      - name: Test shared extractor
        run: bash scripts/test_extract.sh

      - name: Test content keys
        run: bash scripts/test_keys.sh

      - name: Test Android Git source fallback
        run: bash platforms/android/test_download_git.sh

      # The runner's cc, readelf and objcopy add a real linked ELF to the
      # synthetic ELF/PE/PDB fixtures.
      - name: Test debug symbols
        run: bash scripts/test_symbols.sh

      - name: Test windows package pinning
        run: python3 platforms/windows/test_pin_packages.py

      # The linux driver has no other runner. The harness needs only bash, git
      # and python3 (every build tool is stubbed and JOBS=1 keeps nproc out of
      # it), and it is the only gate on the mpv/ffmpeg configure flags whose
      # loss still compiles, links and plays -- just degraded.
      - name: Test linux build plan
        run: bash platforms/linux/test.sh

      # Every nonempty (component, group) series must still apply cleanly to
      # the exact source tree versions.json pins for it, otherwise the next
      # publish run breaks. `apply --check` lands the whole stack and unwinds
      # it again, so the clone stays pristine.
      - name: Apply every series against its pinned source
        run: |
          python3 - <<'PY'
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          # The group list is discovered from platforms/*/group.json by keys.py,
          # not restated here, so a new group cannot be silently unchecked.
          GROUPS = subprocess.run([sys.executable, 'scripts/keys.py', 'groups'],
                                  capture_output=True, text=True, check=True).stdout.split()
          if not GROUPS:
              raise SystemExit('keys.py groups reported no platform groups')

          # A fresh directory per run, deliberately outside the checkout: the
          # gate below has to acquire and apply every series itself, so nothing
          # may survive from an earlier run into this one. A persisted or
          # self-hosted workspace, `clean: false` or `act` would otherwise find
          # a pre-existing clone and skip the only check that proves a series
          # still applies.
          work = Path(tempfile.mkdtemp(prefix='ci-sources-'))

          def resolve(component, group):
            result = subprocess.run(
              [sys.executable, 'scripts/patches.py', 'resolve', component, group],
              capture_output=True, text=True, check=True)
            return [line for line in result.stdout.splitlines() if line.strip()]

          def fetch(component, group, dest):
            # The pin contract lives in scripts/patches.py fetch-pinned: it
            # resolves the override-aware pin, clones the ref, proves HEAD is
            # the pinned commit and applies the series. --check unwinds the
            # tree again, so the clone stays pristine.
            subprocess.run(
              [sys.executable, 'scripts/patches.py', 'fetch-pinned', component, group, str(dest)],
              check=True)

          checked = 0
          for component_dir in sorted(Path('patches').iterdir()):
            if not component_dir.is_dir():
              continue
            component = component_dir.name
            for group in GROUPS:
              series = resolve(component, group)
              if not series:
                continue
              dest = work / f'{component}-{group}'
              print(f'{component}/{group}: checking {len(series)} patch(es)')
              # fetch-pinned lands the series for real: applied is what the
              # harnesses below need, and a patch that does not apply aborts
              # the step. Nothing above may skip it: `checked` counts only
              # series that were actually acquired and applied here.
              fetch(component, group, dest)
              checked += 1
              if component == 'mpv' and group == 'apple':
                # The player's half of the passthrough fallback: plain C, no
                # Apple frameworks.
                subprocess.run(['bash', 'scripts/test_audio_passthrough_fallback.sh', str(dest)], check=True)
              if component == 'mpv' and group == 'android':
                subprocess.run(['bash', 'scripts/test_audiotrack_timing.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_audiotrack_truehd.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_timing.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_vsync.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_rebind.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_letterbox.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_lavc_busy_policy.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_player_queue_frames.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_audio_reload_held_frame.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_player_release_held_frame.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_demux_refresh.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_av_log_routing.sh', str(dest)], check=True)
                # The oracle decoders build from the ffmpeg/android tree
                # checked above ('ffmpeg' sorts before 'mpv').
                subprocess.run(['bash', 'scripts/test_demux_codec_profile.sh', str(dest),
                                str(work / 'ffmpeg-android')], check=True)
                # mpv's decoder filter driving FFmpeg's MediaCodec decoder:
                # both android trees.
                subprocess.run(['bash', 'scripts/test_mediacodec_paused.sh', str(dest),
                                str(work / 'ffmpeg-android')], check=True)
                # The mpv-android AAR's JNI glue against fakes, with the
                # patched mpv and FFmpeg headers of both android trees.
                subprocess.run(['bash', 'scripts/test_android_glue.sh', str(dest),
                                str(work / 'ffmpeg-android')], check=True)
              if component == 'ffmpeg' and group == 'android':
                subprocess.run(['bash', 'scripts/test_mediacodec_input.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_eos.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_flush.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_error.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_crop.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_rendered.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_rate.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_shed.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_mediacodec_reorder.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_pgs_palette.sh', str(dest)], check=True)
                subprocess.run(['bash', 'scripts/test_tcp_family_lookup.sh', str(dest)], check=True)

          if checked == 0:
            raise SystemExit('no (component, group) series resolved; expected at least mpv/apple')
          print(f'checked {checked} series')
          shutil.rmtree(work, ignore_errors=True)
          PY

  android-plan:
    name: Android plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' && inputs.pr_number == '' }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-android-plan"]}}', github.run_id)) }}
    outputs:
      natives: ${{ steps.stale.outputs.natives }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The tarballs are built only when this tree moves their key (a pin,
      # patch, driver or toolchain change): the AAR must build against the
      # natives the merge will publish. Otherwise it packs the published ones.
      - name: Is the libmpv-android key published?
        id: stale
        shell: bash
        run: |
          stale="$(python3 scripts/keys.py stale --platform-group android)"
          if grep -qx libmpv-android <<< "${stale}"; then
            echo "natives=true" >> "$GITHUB_OUTPUT"
            echo "libmpv-android is stale: building the tarballs" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "natives=false" >> "$GITHUB_OUTPUT"
            echo "libmpv-android is published: the AAR packs those tarballs" >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' && inputs.pr_number == '' }}
    needs: android-plan
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      natives: ${{ needs.android-plan.outputs.natives == 'true' }}
      device-tests: true

  spatial:
    name: Spatial audio
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' && inputs.pr_number == '' }}
    # The harnesses compile Objective-C and Swift against Apple's frameworks.
    permissions:
      contents: read
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-spatial"]}}', github.run_id)) }}
    env:
      # Keep small Python and Rust caches on local APFS for reliable metadata access.
      PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/python@3.12/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Apple spatial-test toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in clang clang++ swift python3 xcrun; do
            command -v "$tool" >/dev/null || { echo "missing Apple spatial-test tool: $tool" >&2; exit 1; }
          done
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          test -d "$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$(xcrun --sdk appletvos --show-sdk-path)"

      - name: Test spatial audio output
        run: bash scripts/test_ao_spatial.sh

      - name: Test spatial audio bridge
        run: bash scripts/test_spatial_feed.sh

      # A real AVPlayer in a process that never services the main queue.
      - name: Test AVFoundation passthrough fallback
        run: bash scripts/test_ao_avfoundation_fallback.sh

      # The Swift side exactly as libmpv's tvOS slice compiles it, against the
      # pinned SpatialAudioBridge; only the Rust core is left to publish.
      - name: Compile the spatial bridge for tvOS
        run: |
          python3 scripts/patches.py fetch-pinned mpv apple "$RUNNER_TEMP/mpv"
          python3 scripts/build_spatial.py --bridge-only \
            --source "$RUNNER_TEMP/spatial-audio-bridge" --output "$RUNNER_TEMP/spatial" \
            --mpv "$RUNNER_TEMP/mpv" --target arm64-apple-tvos14.0 \
            --sdk "$(xcrun --sdk appletvos --show-sdk-path)"

  build:
    name: Demo apps
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' && inputs.pr_number == '' }}
    # The demo builds are expensive; run them only through explicit dispatch.
    permissions:
      contents: write
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) }}
    env:
      # Keep small Python and Rust caches on local APFS for reliable metadata access.
      PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/python@3.12/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Verify demo app SDKs
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          for sdk in macosx iphoneos iphonesimulator; do
            sdk_path="$(xcrun --sdk "$sdk" --show-sdk-path)"
            test -d "$sdk_path" || { echo "missing Xcode SDK: $sdk" >&2; exit 1; }
          done

      - name: Build macOS
        run: |
          xcodebuild -resolvePackageDependencies \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -project Demo/Demo-macOS/Demo-macOS.xcodeproj \
            -scheme Demo-macOS

          xcodebuild -project Demo/Demo-macOS/Demo-macOS.xcodeproj \
            -scheme Demo-macOS \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS
        run: |
          xcodebuild -resolvePackageDependencies \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -project Demo/Demo-iOS/Demo-iOS.xcodeproj \
            -scheme Demo-iOS

          xcodebuild -project Demo/Demo-iOS/Demo-iOS.xcodeproj \
            -scheme Demo-iOS \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build


      - name: Build Succeeded
        run: |
          echo "Build completed successfully."

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [patches]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action_tag == 'ci' &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      inputs.pr_author == 'snapetech' &&
      inputs.runner_pool_tag == 'private' &&
      inputs.pr_repository == github.repository &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-mpv-build","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ inputs.pr_sha }}
          PATCH_RESULT: ${{ needs.patches.result }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          sha = os.environ["PR_SHA"]
          result = os.environ["PATCH_RESULT"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          conclusion = "success" if result == "success" else (
              "cancelled" if result == "cancelled" else "failure"
          )
          payload = json.dumps({
              "name": "mpv-build owner PR validation",
              "head_sha": sha,
              "external_id": os.environ["VALIDATION_RUN_ID"],
              "status": "completed",
              "conclusion": conclusion,
              "details_url": (
                  "https://github.com/snapetech-org/mpv-build/actions/runs/"
                  + os.environ["VALIDATION_RUN_ID"]
              ),
              "output": {
                  "title": "mpv-build validation " + conclusion,
                  "summary": "See the linked main-pinned workflow run for patch-series validation details.",
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/mpv-build/check-runs",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(f"check-run creation returned HTTP {response.status}")
          PY
